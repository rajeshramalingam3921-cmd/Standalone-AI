name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thiran
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: thiran_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thiran" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database: the store contract tests drop and recreate its schema.
      TEST_DATABASE_URL: postgresql://thiran:ci-only-password@localhost:5432/thiran_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: End-to-end test (built app, mock AI)
        run: pnpm e2e
      - name: Dependency audit
        run: pnpm audit:deps
